name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No Adobe app, GPU, secret or network: live tests (PVE_LIVE=1) skip, agent stages are never run.
      - name: offline suite (includes the public scrub test)
        run: python -m unittest discover -s tests -v
      - name: scrub gate on its own
        run: python -m unittest tests.test_public_scrub -v
      - name: pipeline status
        run: python pipeline.py status
